# Render Blueprint Specification for lexior-simulator
# Reference: https://render.com/docs/blueprints

services:
  # =========================================================================
  # 1. Backend: Python Flask Web Service (Docker)
  # =========================================================================
  - type: web
    name: lexiorsimulator-backend
    env: docker
    dockerfilePath: backend/Dockerfile.backend
    dockerContext: .
    plan: starter # Persistent disks require a paid plan (Starter or higher)
    envVars:
      - key: LLM_API_KEY
        sync: false # Prompts the user for the API key during deployment
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/ # Defaults to Gemini OpenAI compatible endpoint
      - key: LLM_MODEL_NAME
        value: gemini-1.5-flash # 1.5-flash allows 1500 req/day on the free tier (2.5-flash is limited to 20 req/day)
      - key: ZEP_API_KEY
        value: "" # Optional, leave blank if not using Zep Cloud
      - key: FLASK_DEBUG
        value: "false"
    disk:
      name: lexiorsimulator-uploads-data
      mountPath: /app/backend/uploads
      sizeGB: 10

  # =========================================================================
  # 2. Frontend: Vue.js Single Page Application (Static Site)
  # =========================================================================
  - type: web
    name: lexiorsimulator-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Automatically inject the public URL of the backend service
      - key: VITE_API_BASE_URL
        value: https://lexiorsimulator-backend.onrender.com # Replace with your actual backend Render URL if it differs
      # Enforce modern Node.js version
      - key: NODE_VERSION
        value: 22.2.0
      # Supabase Auth configuration
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      # Rewrite rule for HTML5 History Mode (Vue Router)
      - type: rewrite
        source: /*
        destination: /index.html
