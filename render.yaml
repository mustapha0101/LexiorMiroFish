# Render Blueprint Specification for lexior-simulator
# Reference: https://render.com/docs/blueprints

services:
  # =========================================================================
  # 1. Backend: Python Flask Web Service (Docker)
  # =========================================================================
  - type: web
    name: lexior-backend
    env: docker
    dockerfilePath: backend/Dockerfile.backend
    dockerContext: .
    plan: starter # Persistent disks require a paid plan (Starter or higher)
    envVars:
      - key: LLM_API_KEY
        sync: false # Prompts the user for the API key during deployment
      - key: LLM_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1 # Defaults to DashScope (Qwen), change if using OpenAI
      - key: LLM_MODEL_NAME
        value: qwen-plus
      - key: ZEP_API_KEY
        value: "" # Optional, leave blank if not using Zep Cloud
      - key: FLASK_DEBUG
        value: "false"
    disk:
      name: lexior-uploads-data
      mountPath: /app/backend/uploads
      sizeGB: 10

  # =========================================================================
  # 2. Frontend: Vue.js Single Page Application (Static Site)
  # =========================================================================
  - type: web
    name: lexior-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Automatically inject the public URL of the backend service
      - key: VITE_API_BASE_URL
        value: https://lexior-backend.onrender.com # Replace with your actual backend Render URL if it differs
      # Enforce modern Node.js version
      - key: NODE_VERSION
        value: 20.0.0
    routes:
      # Rewrite rule for HTML5 History Mode (Vue Router)
      - type: rewrite
        source: /*
        destination: /index.html
